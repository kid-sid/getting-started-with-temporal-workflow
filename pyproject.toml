[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "url-summarizer-temporal"
version = "0.1.0"
description = "Scrape a URL and summarize its content using GPT-4o-mini via a Temporal workflow"
requires-python = ">=3.12"
dependencies = [
    "agentex-sdk",
    "temporalio",
    "python-dotenv",
    "httpx",
    "beautifulsoup4",
]

[tool.hatch.build.targets.wheel]
packages = ["project"]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

[tool.uv.workspace]
members = ["agentex"]
